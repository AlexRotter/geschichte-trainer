<style>
:root{
  --bg:#eef4ff; --card:#fff; --ink:#1b2540; --muted:#5b6785; --line:#d6dff0;
  --blue:#2a6df4; --blue-d:#1b4fc0; --ok:#1f9d55; --ok-bg:#e3f6ea; --bad:#d63b3b; --bad-bg:#fde8e8;
  --warn:#b7791f; --warn-bg:#fff5df; --sea:#cfe4f7; --land:#ffffff; --other:#e4e4e4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:1.3rem;margin:0;flex:1}
.btn{appearance:none;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:12px 16px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.small{padding:7px 12px;font-size:.9rem;border-radius:10px}
.btn.ghost{background:transparent;color:var(--blue);padding:8px 10px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(20,40,90,.08);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:88px}
.tile:hover{border-color:var(--blue)}
.tile b{font-size:1rem}
.tile span{color:var(--muted);font-size:.85rem}
.tile .ic{font-size:1.5rem;line-height:1}
.tile.hi{border-color:var(--blue);background:#f2f7ff}
h2{font-size:1.1rem;margin:18px 0 8px}
.muted{color:var(--muted)}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;font:inherit;padding:9px 6px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.settings{display:flex;flex-direction:column;gap:8px}
.settings label{font-size:.85rem;color:var(--muted);font-weight:600}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.prompt{font-size:1.25rem;font-weight:700;margin:6px 0 12px}
.prompt small{display:block;font-size:.9rem;font-weight:500;color:var(--muted);margin-top:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);touch-action:manipulation}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.txt{display:flex;gap:8px}
.txt input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border:2px solid var(--line);border-radius:12px}
.txt input:focus{outline:none;border-color:var(--blue)}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-weight:600;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:#166b3b}
.fb.bad{display:block;background:var(--bad-bg);color:#9b2020}
.fb.warn{display:block;background:var(--warn-bg);color:#7a4e0e}
.fb .ex{font-weight:400;margin-top:4px;color:var(--ink)}
.next{margin-top:12px;width:100%}
.mapbox{position:relative;background:var(--sea);border-radius:14px;overflow:hidden;border:2px solid var(--line);margin-bottom:12px;touch-action:pan-y}
.mapbox.zoomed{touch-action:none}
.mapbox svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mapbox .zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapbox .zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1.3rem;font-weight:700;color:var(--ink);cursor:pointer}
.mapbox .hint{position:absolute;left:8px;bottom:6px;font-size:.75rem;color:var(--muted);background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px}
path.c{fill:var(--land);stroke:#4a5568;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
path.c.tap:hover{fill:#eaf1ff}
path.o{fill:var(--other);stroke:#b5b5b5;stroke-width:.5;vector-effect:non-scaling-stroke}
path.c.dim{fill:#f4f6fa}
path.c.hl{fill:#ffcf3f}
path.c.ok{fill:#5cc98a}
path.c.bad{fill:#f08080}
.sea circle{fill:#fff;stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke}
.sea text{font-weight:800;fill:var(--blue-d);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sea.tap{cursor:pointer}
.sea.hl circle{fill:#ffcf3f;stroke:#b7791f}
.sea.ok circle{fill:#5cc98a;stroke:var(--ok)}
.sea.bad circle{fill:#f08080;stroke:var(--bad)}
.sea.dim{opacity:.35}
.lbl{font-weight:700;fill:#1b2540;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.8rem;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tip{border-left:4px solid var(--blue);background:#f2f7ff;padding:10px 12px;border-radius:8px;margin:8px 0}
.tip.warn{border-color:var(--warn);background:var(--warn-bg)}
.flip{perspective:900px;cursor:pointer;margin:6px 0 12px}
.flip .in{position:relative;min-height:170px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;text-align:center}
.flip .f{background:#fff;border:2px solid var(--line)}
.flip .b{background:#f2f7ff;border:2px solid var(--blue);transform:rotateY(180deg)}
.flip .big{font-size:1.6rem;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.stat{display:flex;align-items:center;gap:10px;margin:8px 0}
.stat .bar{flex:1;height:12px;background:var(--line);border-radius:7px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ok)}
.stat b{min-width:44px;text-align:right}
.stat span{min-width:150px}
.big-res{font-size:2.4rem;font-weight:800;text-align:center;margin:6px 0}
.rev{font-size:.92rem}
.rev .r{padding:8px 0;border-bottom:1px solid var(--line)}
.rev .r.bad b{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2540;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
@media (max-width:420px){.opts{grid-template-columns:1fr}.prompt{font-size:1.12rem}.stat span{min-width:110px}}
.tlbox{background:#fff;border:2px solid var(--line);border-radius:14px;overflow-x:auto;overflow-y:hidden;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tl{display:block;width:100%;min-width:720px;height:auto;user-select:none;-webkit-user-select:none}
.tll{font-size:17px;font-weight:700;fill:#1b2540;text-anchor:middle}
.tlc{font-size:13px;fill:#5b6785;text-anchor:middle}
.tlb{font-size:15px;font-weight:700;fill:#1b2540;text-anchor:middle}
.tlm{font-size:17px;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px}
textarea{width:100%;font:inherit;font-size:1.05rem;padding:12px;border:2px solid var(--line);border-radius:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--blue)}
.fb.plain{display:block;background:#f2f7ff;color:var(--ink);font-weight:400}
.checks{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-weight:500}
.chk input{width:22px;height:22px;flex:none;margin:0}
.okt{color:#166b3b;font-weight:700;margin-bottom:6px}.badt{color:#9b2020;font-weight:700;margin-bottom:6px}
.chosen{min-height:30px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.chosen .chip{background:#e3ecff;color:var(--blue-d)}
.opt.used{opacity:.4}
.flip .mid{font-size:1.1rem;font-weight:600;line-height:1.4}
ul{margin:4px 0 10px;padding-left:22px}
.chcard{padding:14px}
.chhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.chic{font-size:1.8rem;line-height:1}
.chcard .row .btn{flex:1;min-width:0;padding:10px 6px}
.sortl{display:flex;flex-direction:column;gap:8px}
.srow{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.srow.ok{border-color:var(--ok);background:var(--ok-bg)}
.srow.bad{border-color:var(--bad);background:var(--bad-bg)}
.sitem{font-weight:700;margin-bottom:6px}
.scats{display:flex;flex-wrap:wrap;gap:6px}
.sc{border:2px solid var(--line);background:#f7f9fd;border-radius:999px;padding:6px 11px;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink);cursor:pointer;touch-action:manipulation}
.sc.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sfb{font-size:.85rem;margin-top:4px}
.gtext{font-size:1.05rem;line-height:2.3}
.gap{font:inherit;font-size:1rem;padding:4px 6px;border:2px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
input.gap{width:9.5em}input.gap.num{width:3.2em;text-align:center}
.gap.ok{border-color:var(--ok);background:var(--ok-bg);color:#166b3b}
.gap.bad{border-color:var(--bad);background:var(--bad-bg);color:#9b2020}
.corr{display:inline-block;margin-left:4px;font-weight:700;color:var(--ok);font-size:.95rem}
.pts{float:right;font-weight:700}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}
.trow{padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tlq{margin-bottom:8px;font-size:1.05rem}
.learn h2{margin-top:18px}
.prompt{line-height:1.35}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(238,244,255,.97);box-shadow:0 -4px 18px rgba(20,40,90,.2);max-height:55vh;overflow:auto}
.actbar .fb,.actbar #act{max-width:828px;margin-left:auto;margin-right:auto}
.actbar .fb{margin-top:0}.actbar .next{margin-top:0}
body.hasfb .actbar{cursor:pointer}
.actbar .fb:not(.ok):not(.bad):not(.warn):not(.plain){display:none}
.tapnext{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;color:var(--blue-d);font-size:.95rem;margin-top:8px}
.tapnext span.go{background:var(--blue);color:#fff;border-radius:999px;padding:8px 16px;white-space:nowrap}
body.hasbar .wrap{padding-bottom:110px}body.hasfb .wrap{padding-bottom:58vh}
#fbin.fb{margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================
   INHALTE nach Kapiteln – aus den Heftseiten (Westermann):
   1 Geschichtliche Quellen · 2 Zeit und Epochen ·
   3 Leben in der Altsteinzeit · 4 Wohnen in der Altsteinzeit
   ========================================================= */
const QT={S:{n:'Schriftliche Quellen',s:'Schrift',d:'etwas Geschriebenes'},M:{n:'Mündliche Quellen',s:'mündlich',d:'etwas Erzähltes oder Gesprochenes'},B:{n:'Bildquellen',s:'Bild',d:'ein Bild'},Sa:{n:'Sachquellen',s:'Sache',d:'ein Gegenstand, Gebäude oder Überrest'}};
// Begriff, Überkategorie, [auch vertretbar], Hinweis – alle Begriffe vom Arbeitsblatt + Beispiele vom Hefteintrag
const QUELLEN=[
 ['Tagebücher','S'],['Urkunden','S'],['Verträge','S'],['Briefe','S'],['Gesetze','S'],['Zeitung','S'],['Testament','S'],
 ['Inschriften','S',['Sa'],'Eine Inschrift ist Geschriebenes – sie steht aber auf einem Gegenstand.'],
 ['Sagen','M',['S'],'Sagen wurden zuerst erzählt und erst später aufgeschrieben.'],['Erzählung','M'],
 ['Erinnerungen','M',['S'],'Erzählte Erinnerungen sind mündlich – aufgeschrieben werden sie zur Schriftquelle.'],
 ['Mythen','M',['S'],'Mythen wurden lange nur erzählt und erst später aufgeschrieben.'],['Interview','M'],['Tonbandaufzeichnungen','M'],
 ['Legenden','M',['S'],'Legenden wurden mündlich weitererzählt.'],
 ['Zeichnungen','B'],['Höhlenmalerei','B'],['Fotos','B'],['Gemälde','B'],['Karten','B',['S'],'Karten sind gezeichnet – sie enthalten aber oft auch Schrift.'],
 ['Kutsche','Sa'],['Möbel','Sa'],['Grabsteine','Sa',['S'],'Ein Grabstein ist ein Gegenstand – die Inschrift darauf ist Geschriebenes.'],['Knochenreste','Sa'],['Ruinen','Sa'],
 ['Münzen','Sa'],['Lanzen','Sa'],['Uniform','Sa'],['Schiffswrack','Sa'],['Gefäße','Sa'],['Trachten','Sa'],['Pistolen','Sa'],['Gebäude','Sa'],['Fossilien','Sa']
].map(a=>({n:a[0],c:a[1],alt:a[2]||[],hint:a[3]||''}));

const DARST=[
 ['Schulbuchtext über die Steinzeit','D'],['Jugendsachbuch über die Römer','D'],['Geschichtsdokumentation im Fernsehen','D'],
 ['Zeichnung einer Steinzeithöhle auf deinem Arbeitsblatt','D'],['Spielfilm über Ritter','D'],['Museumsmodell eines Steinzeitlagers','D'],
 ['Faustkeil aus einer Ausgrabung','Q'],['Römische Münze','Q'],['Höhlenmalerei aus der Steinzeit','Q'],['Brief deines Urgroßvaters','Q'],
 ['Foto deiner Großeltern als Kinder','Q'],['Interview mit deiner Oma über früher','Q']
].map(a=>({n:a[0],c:a[1]}));

const EPO=[
 {k:'VG',n:'Vorgeschichte',z:'bis 2000 v. Chr.',von:-99999,bis:-2000,col:'#6cc7c2'},
 {k:'HK',n:'Frühe Hochkulturen',z:'2000 v. Chr. – 500 v. Chr.',von:-2000,bis:-500,col:'#f2e85c'},
 {k:'AN',n:'Antike',z:'500 v. Chr. – 500 n. Chr.',von:-500,bis:500,col:'#c79be0'},
 {k:'MA',n:'Mittelalter',z:'500 n. Chr. – 1500 n. Chr.',von:500,bis:1500,col:'#f08a80'},
 {k:'NZ',n:'Neuzeit',z:'ab 1500 n. Chr.',von:1500,bis:99999,col:'#8fd48f'}
];
const EK=Object.fromEntries(EPO.map(e=>[e.k,e]));
// die Bilder vom Arbeitsblatt (als Beschreibung)
const EBILD=[
 ['🛖 Hütte aus Fellen und Stangen','VG'],['🧔 Steinzeitmensch mit wildem Haar','VG'],
 ['🔺 Pyramiden in Ägypten','HK'],['👑 Pharao mit gestreiftem Kopftuch','HK'],['🌾 Ägyptischer Bauer erntet mit der Sichel','HK'],
 ['🛡️ Römischer Soldat (Legionär) mit Schild und Speer','AN'],['🗼 Römischer Wachturm am Limes','AN'],
 ['⚔️ Ritter kämpfen auf Pferden','MA'],['🏭 Fabrik mit Förderturm und Eisenbahn','NZ']
].map(a=>({n:a[0],c:a[1]}));
const yTxt=y=>y<0?`${-y} v. Chr.`:`${y} n. Chr.`;

const MAMMUT=[
 {k:'m0',teil:'Stoßzähne und Knochen',use:['Schmuck','Schnitzereien','Waffen','Geräte','Nadeln']},
 {k:'m1',teil:'Fleisch, Leber, Herz, Gehirn, Mark',use:['Nahrung']},
 {k:'m2',teil:'Fell',use:['Kleidung','Zelte','Riemen','Fußlappen','Bodenbelag']},
 {k:'m3',teil:'Fett',use:['Körperbemalung','Nahrung (Fett)']},
 {k:'m4',teil:'Magen, Darm, Blase',use:['getrocknet als Behälter']},
 {k:'m5',teil:'Därme, Sehnen',use:['Schnüre','Nähgarn','Bogensehnen']}
];
const GERAET=[
 {k:'F',n:'Faustkeil',acc:['Faustkeil'],use:'Allzweck-Werkzeug aus Stein: schneiden, schaben, hacken, Tiere zerlegen, Felle bearbeiten'},
 {k:'H',n:'Harpune',acc:['Harpune'],use:'Fische fangen – die Widerhaken halten den Fisch fest'},
 {k:'S',n:'Speerschleuder / Speerspitze',acc:['Speerschleuder','Speerspitze','Speer'],use:'Jagd: die Speerschleuder wirft den Speer weiter und kräftiger, die Speerspitze sitzt vorne am Speer'},
 {k:'N',n:'Nadel (aus Knochen)',acc:['Nadel','Knochennadel','Nähnadel'],use:'Felle zu Kleidung und Zelten zusammennähen – mit Sehnen als Faden'}
];

// Höhle und Zelt
const HZ_MERKMAL=[
 ['ist natürlich entstanden','H'],['wird von den Menschen selbst gebaut','Z'],['besteht aus Tierfellen über Holzstangen oder Mammutknochen','Z'],
 ['kann abgebaut und mitgenommen werden','Z'],['bleibt immer am selben Ort','H'],['gibt es vor allem im Gebirge','H'],['kann man auch im flachen Land aufstellen','Z'],
 ['hat eine Feuerstelle für Wärme, Licht und Schutz','B'],['Menschen arbeiten dort zusammen','B'],['bietet festen Schutz vor Wind, Regen und Kälte','H']
].map(a=>({n:a[0],c:a[1]}));
const HZ_VN=[
 ['muss nicht gebaut werden – ist schon da','HV'],['fester Schutz vor Wind, Regen, Kälte und wilden Tieren','HV'],
 ['kann nicht mitgenommen werden – man ist an den Ort gebunden','HN'],['gibt es nur im Gebirge, nicht überall','HN'],['oft dunkel, feucht und verraucht','HN'],
 ['kann abgebaut und mitgenommen werden – man kann den Tierherden folgen','ZV'],['kann überall aufgestellt werden, auch im flachen Land','ZV'],['Material stammt aus der Jagdbeute (Fell, Knochen) und Holz','ZV'],
 ['muss erst mühsam gebaut werden','ZN'],['schützt bei Sturm und großer Kälte schlechter','ZN']
].map(a=>({n:a[0],c:a[1]}));
const HZ_ORT=[
 ['Gebirge mit Felsen','H'],['Schweiz (vor ca. 50 000 Jahren)','H'],['flaches Land','Z'],['Schleswig-Holstein (vor ca. 14 000 Jahren)','Z'],['Küste am Meer','Z'],['weite Steppe ohne Felsen','Z']
].map(a=>({n:a[0],c:a[1]}));

// Richtig/Falsch je Kapitel
const TF={

function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}}
function record(id,frac){const it=DB.tasks[id]||(DB.tasks[id]={h:[]});it.h.push(Math.round(frac*100)/100);if(it.h.length>4)it.h.shift();save();}
const OK=0.8;
function mastered(id){const it=DB.tasks[id];return !!(it&&it.h.length>=2&&it.h.slice(-2).every(x=>x>=OK));}
function weak(id){const it=DB.tasks[id];return !!(it&&it.h.length&&!mastered(id)&&it.h.some(x=>x<OK));}

const n1=s=>s.toLowerCase().trim().replace(/\s+/g,' ').replace(/^(die|der|das|ein|eine)\s+/,'');
const n2=s=>n1(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[\s\-.]/g,'');
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function checkText(input,answers){
  if(!input.trim())return 'bad';
  if(answers.some(a=>n1(a)===n1(input)))return 'ok';
  if(answers.some(a=>n2(a)===n2(input)))return 'umlaut';
  const x=n2(input);
  if(answers.some(a=>{const y=n2(a);return y.length>3&&lev(x,y)<=Math.max(1,Math.min(3,Math.floor(y.length/4)));}))return 'near';
  return 'bad';
}
const useText=()=>DB.set.answer==='text';
const chOf=k=>CH.find(c=>c.k===k);

/* =========================================================
   ZEITLEISTE (wie auf dem Arbeitsblatt: 1000 v. Chr. bis heute)
   ========================================================= */
const TL={min:-1000,max:2100,x0:44,x1:956};
const tx=y=>TL.x0+(y-TL.min)/(TL.max-TL.min)*(TL.x1-TL.x0);
function timeline(box,o={}){
  const H=o.bands?150:118;
  let s=`<svg viewBox="0 0 1000 ${H}" class="tl"><rect x="0" y="0" width="1000" height="${H}" fill="#fff"/>`;
  if(o.bands)EPO.forEach(e=>{const a=tx(Math.max(e.von,TL.min)),b=tx(Math.min(e.bis,TL.max));if(b<=a)return;s+=`<rect x="${a}" y="100" width="${b-a}" height="44" fill="${e.col}"/><text x="${(a+b)/2}" y="127" class="tlb">${e.n.replace('Frühe ','')}</text>`;});
  s+=`<g class="bands"></g><rect x="${TL.x0}" y="44" width="${TL.x1-TL.x0}" height="20" rx="4" fill="#e8ecf5" stroke="#8a94ad" fill-opacity=".85"/>`;
  for(let y=-1000;y<=2100;y+=100){const x=tx(y);const big=y%500===0;s+=`<line x1="${x}" y1="${big?36:44}" x2="${x}" y2="${big?72:64}" stroke="#4a5568" stroke-width="${big?2:1}"/>`;
    if(big)s+=`<text x="${x}" y="28" class="tll">${y<0?-y+' v.':y===0?'Chr. Geb.':y}</text>`;
    if(y<2100){const c=y<0?(-y)/100:y/100+1;s+=`<text x="${tx(y+50)}" y="88" class="tlc">${c}.</text>`;}}
  s+=`<line x1="${tx(0)}" y1="10" x2="${tx(0)}" y2="${H-8}" stroke="#d63b3b" stroke-width="2.5"/><g class="marks"></g></svg>`;
  box.innerHTML=s;box.classList.add('tlbox');
  const svg=box.querySelector('svg'),g=svg.querySelector('.marks'),gb=svg.querySelector('.bands');
  if(o.onTap){svg.style.cursor='crosshair';svg.addEventListener('click',e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());const y=Math.round(TL.min+(q.x-TL.x0)/(TL.x1-TL.x0)*(TL.max-TL.min));o.onTap(Math.max(TL.min,Math.min(TL.max,y)));});}
  return{mark(y,col,t,up){const x=tx(y);g.insertAdjacentHTML('beforeend',`<g><line x1="${x}" y1="38" x2="${x}" y2="70" stroke="${col}" stroke-width="4"/><text x="${x}" y="${up?14:108}" class="tlm" fill="${col}">✕ ${esc(t||'')}</text></g>`);},
    band(a,b,col){gb.insertAdjacentHTML('beforeend',`<rect x="${tx(Math.max(a,TL.min))}" y="44" width="${tx(Math.min(b,TL.max))-tx(Math.max(a,TL.min))}" height="20" fill="${col}"/>`);},clear(){g.innerHTML='';gb.innerHTML='';}};
}

/* =========================================================
   AUFGABE ANZEIGEN UND AUSWERTEN
   Jede Aufgabe meldet {pts, max} zurück.
   ========================================================= */
// Feste Leiste unten: Prüfen-Knopf, danach Erklärung; Tippen irgendwo = weiter
let armed=null;
function unlisten(){if(armed){document.removeEventListener('click',armed.c,true);document.removeEventListener('keydown',armed.k,true);clearTimeout(armed.t);armed=null;}}
function disarm(){unlisten();const b=document.getElementById('actbar');if(b)b.remove();document.body.classList.remove('hasbar','hasfb');}
function armNext(fn){unlisten();const c=e=>{if(e.target.closest('#back'))return;e.preventDefault();e.stopPropagation();unlisten();fn();};
  const k=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();unlisten();fn();}};
  armed={c,k};armed.t=setTimeout(()=>{if(armed&&armed.c===c){document.addEventListener('click',c,true);document.addEventListener('keydown',k,true);}},250);}
function renderTask(box,t,onDone,exam){
  disarm();
  box.innerHTML=`<div class="prompt">${t.type==='free'?esc(t.f.q):esc(t.title)}</div><div class="tbody"></div><div id="fbin"></div>`;
  const bar=document.createElement('div');bar.id='actbar';bar.className='actbar';bar.innerHTML='<div class="fb" id="fb"></div><div id="act"></div>';
  document.body.appendChild(bar);document.body.classList.add('hasbar');
  const body=box.querySelector('.tbody'),fb=bar.querySelector('#fb'),act=bar.querySelector('#act');
  const btn=(txt,fn)=>{act.innerHTML=`<button class="btn next">${txt}</button>`;act.querySelector('button').onclick=fn;};
  const done=(pts,max)=>{disarm();onDone(pts,max);};
  const finish=(pts,max,html,cls)=>{if(exam){done(pts,max);return;}fb.className='fb '+(cls||(pts/max>=OK?'ok':'bad'));fb.innerHTML=html;document.body.classList.add('hasfb');
    act.innerHTML='<div class="tapnext"><span>👆 Tippe irgendwo für weiter</span><span class="go">Weiter ›</span></div>';armNext(()=>done(pts,max));};
  const headline=(pts,max)=>`${pts/max>=OK?'Gut gemacht! ✅':'Schau dir die markierten Stellen noch einmal an.'} <span class="pts">${Math.round(pts*10)/10} von ${max} Punkten</span>`;

  if(t.type==='sort'){
    const sel={};
    body.innerHTML=`<div class="sortl">${t.items.map((it,i)=>`<div class="srow" data-i="${i}"><div class="sitem">${esc(it.n)}</div><div class="scats">${t.cats.map(c=>`<button class="sc" data-c="${c.k}">${esc(c.n)}</button>`).join('')}</div><div class="sfb"></div></div>`).join('')}</div>`;
    body.querySelectorAll('.srow').forEach(r=>r.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{if(r.dataset.done)return;r.querySelectorAll('.sc').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel[r.dataset.i]=b.dataset.c;}));
    btn('Prüfen',()=>{
      if(Object.keys(sel).length<t.items.length){toast('Ordne erst alle zu 🙂');return;}
      let pts=0;const hints=[];
      t.items.forEach((it,i)=>{const r=body.querySelector(`.srow[data-i="${i}"]`);r.dataset.done=1;const v=sel[i];const ok=v===it.c||(it.alt||[]).includes(v);if(ok)pts++;
        r.classList.add(ok?'ok':'bad');const cn=t.cats.find(c=>c.k===it.c).n;
        r.querySelector('.sfb').innerHTML=ok?((it.alt||[]).includes(v)?`✔ gilt auch – meist: <b>${esc(cn)}</b>`:'✔'):`✘ richtig: <b>${esc(cn)}</b>`;
        if(it.hint&&(!ok||v!==it.c))hints.push(it.hint);});
      finish(pts,t.items.length,headline(pts,t.items.length)+(hints.length?`<div class="ex">${hints.map(esc).join('<br>')}</div>`:'')+(t.ex?`<div class="ex">${esc(t.ex)}</div>`:''));
    });
  }
  else if(t.type==='gaps'){
    const bank=shuffle([...new Set([...t.gaps.filter(g=>!g.sel&&!g.num).map(g=>g.acc[0]),...(t.bank||[])])]);
    let k=0;const html=esc(t.tpl).replace(/&lt;br&gt;/g,'<br>').replace(/&lt;(\/?)b&gt;/g,'<$1b>').replace(/\{(\d+)\}/g,(m,i)=>{const g=t.gaps[+i];
      if(g.num)return `<input class="gap num" data-g="${i}" inputmode="numeric" autocomplete="off">`;
      if(g.sel||!useText())return `<select class="gap" data-g="${i}"><option value="">…</option>${(g.opts?shuffle(g.opts):bank).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
      return `<input class="gap" data-g="${i}" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off">`;});
    body.innerHTML=`<div class="gtext">${html}</div>${!useText()&&bank.length?'':''}`;
    btn('Prüfen',()=>{
      const els=[...body.querySelectorAll('.gap')];if(els.some(e=>!e.value.trim())){toast('Fülle erst alle Lücken aus 🙂');return;}
      let pts=0;const used=new Set();const notes=[];
      els.forEach(e=>{const g=t.gaps[+e.dataset.g];let accs=g.acc;
        if(t.anyOrder){const hit=t.gaps.findIndex((x,j)=>!used.has(j)&&checkText(e.value,x.acc)!=='bad'&&checkText(e.value,x.acc)!=='near');if(hit>=0){used.add(hit);accs=t.gaps[hit].acc;}}
        const r=(e.tagName==='SELECT'||g.num)?(accs.some(a=>n1(a)===n1(e.value))?'ok':'bad'):checkText(e.value,accs);
        const ok=r==='ok'||r==='umlaut';if(ok)pts++;e.disabled=true;e.classList.add(ok?'ok':'bad');
        if(!ok)e.insertAdjacentHTML('afterend',`<span class="corr">${esc(g.acc[0])}</span>`);
        if(r==='umlaut')notes.push(`Schreibweise: ${g.acc[0]}`);if(r==='near')notes.push(`Fast – achte auf die Schreibweise: ${g.acc[0]}`);});
      finish(pts,els.length,headline(pts,els.length)+(notes.length?`<div class="ex">${notes.map(esc).join('<br>')}</div>`:'')+(t.ex?`<div class="ex">${esc(t.ex)}</div>`:''));
    });
  }
  else if(t.type==='order'){
    const chosen=[];const items=shuffle(t.items);
    body.innerHTML=`<div class="chosen" id="ch"><span class="muted">Tippe der Reihe nach an …</span></div><div class="opts one">${items.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div><button class="btn ghost small" id="undo">↺ Neu anfangen</button>`;
    const draw=()=>{body.querySelector('#ch').innerHTML=chosen.length?chosen.map((s,i)=>`<span class="chip">${i+1}. ${esc(s)}</span>`).join(' '):'<span class="muted">Tippe der Reihe nach an …</span>';};
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;chosen.push(b.textContent);b.disabled=true;b.classList.add('used');draw();});
    body.querySelector('#undo').onclick=()=>{chosen.length=0;body.querySelectorAll('.opt').forEach(b=>{b.disabled=false;b.classList.remove('used');});draw();};
    btn('Prüfen',()=>{if(chosen.length<t.items.length){toast('Tippe erst alle an 🙂');return;}
      body.querySelector('#undo').remove();let pos=0;chosen.forEach((c,i)=>{if(c===t.items[i])pos++;});const max=2,pts=pos===t.items.length?2:pos>=t.items.length-2?1:0;
      finish(pts,max,headline(pts,max)+`<div class="ex">Richtig: <b>${t.items.map(esc).join(' → ')}</b></div>`+(t.ex?`<div class="ex">${esc(t.ex)}</div>`:''));});
  }
  else if(t.type==='timeline'){
    let i=0;const taps=[];
    body.innerHTML=`<div class="tlq">Jetzt eintragen: <b id="cur">${esc(t.targets[0].label)}</b> <span class="muted" id="cnt">(1 von ${t.targets.length})</span></div><div id="tlc"></div><p class="muted" style="margin:6px 0 0;font-size:.85rem">Die rote Linie ist Christi Geburt – links davon „vor Christus". Auf dem Handy kannst du die Zeitleiste seitlich wischen.</p>`;
    const tl=timeline(body.querySelector('#tlc'),{onTap:y=>{if(i>=t.targets.length)return;taps.push(y);tl.mark(y,'#2a6df4',t.targets[i].label,i%2===0);i++;
      if(i<t.targets.length){body.querySelector('#cur').textContent=t.targets[i].label;body.querySelector('#cnt').textContent=`(${i+1} von ${t.targets.length})`;}else{body.querySelector('.tlq').innerHTML='Alle eingetragen – jetzt prüfen.';}}});
    btn('Prüfen',()=>{if(i<t.targets.length){toast('Trage erst alle ein 🙂');return;}
      tl.clear();let pts=0;const lines=[];
      t.targets.forEach((g,k)=>{const y=taps[k];let ok;
        if(g.y!==undefined){ok=Math.abs(y-g.y)<=80;tl.mark(g.y,'#1f9d55',g.label,k%2===0);if(!ok)tl.mark(y,'#d63b3b','',false);}
        else{ok=y>=g.von&&y<g.bis;tl.band(g.von,g.bis,ok?'rgba(31,157,85,.45)':'rgba(214,59,59,.35)');tl.mark(y,ok?'#1f9d55':'#d63b3b',g.label,k%2===0);}
        if(ok)pts++;lines.push(`${ok?'✔':'✘'} ${esc(g.label)}${g.z?` (${esc(g.z)})`:''}${ok?'':` – du hast bei ${yTxt(y)} getippt`}`);});
      finish(pts,t.targets.length,headline(pts,t.targets.length)+`<div class="ex">${lines.join('<br>')}</div>`);});
  }
  else if(t.type==='free'){
    body.innerHTML=`<textarea id="fa" rows="5" placeholder="Schreibe deine Antwort in Stichpunkten oder ganzen Sätzen – wie in der Probe …"></textarea>`;
    btn('Fertig – mit Musterantwort vergleichen',()=>{const v=body.querySelector('#fa').value;if(!v.trim()){toast('Schreib erst deine Antwort 🙂');return;}
      body.querySelector('#fa').disabled=true;const low=v.toLowerCase();
      const fbi=box.querySelector('#fbin');fbi.className='fb plain';fbi.innerHTML=`<b>Vergleiche mit der Musterantwort.</b> Hake ab, was du sinngemäß geschrieben hast – Vorschläge sind schon angehakt:<div class="checks">${t.f.p.map((p,k)=>`<label class="chk"><input type="checkbox" ${new RegExp(p[1]).test(low)?'checked':''}> ${esc(p[0])}</label>`).join('')}</div><div class="ex">Für die volle Punktzahl brauchst du ${t.f.need} von ${t.f.p.length} Punkten.</div>`;
      fbi.scrollIntoView({behavior:'smooth',block:'start'});
      btn('Bewerten ›',()=>{const n=[...fbi.querySelectorAll('input:checked')].length;fbi.querySelectorAll('input').forEach(x=>x.disabled=true);const pts=Math.min(n,t.f.need),max=t.f.need;
        finish(pts,max,headline(pts,max)+`<div class="ex">Die Musterpunkte stehen oben unter deiner Antwort.</div>`);});});
  }
}

function runSet(title,ids,opt={}){
  const app=$('#app');let i=0,P=0,M=0;const log=[];const t0=Date.now();
  if(!ids.length){app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>${esc(title)}</h1></header><div class="card">Hier gibt es gerade nichts zu üben. 🎉</div>`;$('#back').onclick=home;return;}
  function show(){
    const id=ids[i],t=inst(id),c=chOf(t.ch);window.__cur=t;
    app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>${esc(title)}</h1></header>
    <div class="card"><div class="qhead"><span>Aufgabe ${i+1} von ${ids.length}</span><span>${c.ic} ${esc(c.n)}</span></div><div class="progress"><i style="width:${i/ids.length*100}%"></i></div><div id="task"></div></div>`;
    $('#back').onclick=()=>{if(i===0||confirm('Übung abbrechen?')){disarm();home();}};
    renderTask($('#task'),t,(pts,max)=>{record(id,pts/max);P+=pts;M+=max;log.push({id,t,pts,max});i++;i<ids.length?show():finish();},opt.exam);
    window.scrollTo(0,0);
  }
  function finish(){
    disarm();
    const pct=Math.round(P/M*100),sec=Math.round((Date.now()-t0)/1000);
    DB.sessions.push({d:new Date().toISOString(),m:title,p:Math.round(P*10)/10,n:M});if(DB.sessions.length>200)DB.sessions.shift();save();
    const weakT=log.filter(x=>x.pts/x.max<OK);
    app.innerHTML=`<header><h1>${esc(title)} – Auswertung</h1></header>
    <div class="card"><div class="big-res">${Math.round(P*10)/10} / ${M} Punkte</div><p style="text-align:center;margin:0">${pct} % · ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} min</p>
    ${opt.exam?`<p style="text-align:center;font-size:1.3rem;font-weight:800;margin:10px 0 0">Ungefähre Note: ${grade(pct)}</p><p class="muted" style="text-align:center;font-size:.8rem;margin:2px 0 0">Nur ein Richtwert – jede Lehrkraft bewertet etwas anders.</p>`:''}
    <p style="text-align:center">${pct>=90?'🏆 Hervorragend!':pct>=70?'👍 Gut – noch ein bisschen üben!':'💪 Weiter üben – das wird!'}</p>
    <div class="row"><button class="btn" id="again">Nochmal</button>${weakT.length?'<button class="btn sec" id="fix">Schwache Aufgaben üben</button>':''}<button class="btn sec" id="menu">Menü</button></div></div>
    <div class="card rev"><h2 style="margin-top:0">Deine Aufgaben</h2>${log.map(x=>`<div class="r"><span class="${x.pts/x.max>=OK?'okc':'badc'}">${x.pts/x.max>=OK?'✔':'✘'}</span> ${esc(x.t.type==='free'?x.t.f.q:x.t.title)} <b>${Math.round(x.pts*10)/10}/${x.max}</b></div>`).join('')}
    ${opt.exam?'<p class="muted" style="font-size:.85rem">Tipp: Schwache Aufgaben kannst du im jeweiligen Kapitel mit Lösungen und Erklärungen üben.</p>':''}</div>`;
    $('#again').onclick=()=>opt.exam?startExam():runSet(title,ids,opt);$('#menu').onclick=home;
    if(weakT.length)$('#fix').onclick=()=>runSet('Schwache Aufgaben',weakT.map(x=>x.id));
    window.scrollTo(0,0);
  }
  show();
}
function grade(p){return p>=92?'1':p>=81?'2':p>=67?'3':p>=50?'4':p>=30?'5':'6';}
function startExam(){const ids=[];CH.forEach(c=>EXAM[c.k].forEach(g=>ids.push(pick(g,1)[0])));runSet('Probearbeit',ids,{exam:true});}
function startWeak(){runSet('Fehler üben',TASKS.map(t=>t.id).filter(weak));}

function showLearn(k){
  disarm();
  const app=$('#app');const c=chOf(k);let h='';
  if(k==='quellen')h=`
  <div class="tip"><b>Quellen sind</b> Zeugnisse aus der Vergangenheit, auf denen unser Wissen über die Vergangenheit beruht.</div>
  <h2>Die vier Überkategorien – mit allen Beispielen aus deinem Heft</h2>
  <table><tr><th>Überkategorie</th><th>Woran erkennst du sie?</th><th>Beispiele</th></tr>${Object.entries(QT).map(([k2,v])=>`<tr><td><b>${v.n}</b></td><td>${v.d}</td><td>${QUELLEN.filter(q=>q.c===k2).map(q=>esc(q.n)).join(', ')}</td></tr>`).join('')}</table>
  <div class="tip warn"><b>Grenzfälle:</b> Sagen, Mythen, Legenden und Erinnerungen sind <b>mündlich</b>, solange sie erzählt werden – aufgeschrieben werden sie zur Schriftquelle. Inschriften (Schrift) und Grabsteine (Sache) liegen dazwischen, Karten sind Bildquellen mit Schrift. In der App zählt bei Grenzfällen beides.</div>
  <h2>Probleme beim Umgang mit Quellen</h2><ul><li>Viele Quellen sind <b>schlecht erhalten</b>.</li><li>Aus manchen Zeiten gibt es nur <b>wenige</b> Quellen.</li><li>Quellen sind zum Teil bewusst <b>gefälscht</b>.</li><li>Eine Quelle zeigt oft nur die <b>Sicht und Absicht ihres Verfassers</b> – man muss sie vom wirklichen Geschehen unterscheiden.</li></ul>
  <h2>Darstellungen</h2><div class="tip">Darstellungen wie <b>Jugendsachbücher, Schulbücher oder Geschichtsdokumentationen im TV</b> sind <b>keine</b> Quellen. Sie wurden <b>später</b> über die Vergangenheit gemacht. Auch die Zeichnungen auf deinen Arbeitsblättern (Höhle, Zeltlager) sind Darstellungen.</div>
  <h2>Familiengeschichte erforschen</h2><ul><li>Eltern und Großeltern befragen → mündliche Quellen</li><li>Fotos und Fotoalben anschauen → Bildquellen</li><li>Briefe, Tagebücher, Urkunden, alte Zeitungen lesen → Schriftquellen</li><li>Alte Gegenstände ansehen (Schmuck, Möbel) → Sachquellen</li></ul>`;
  if(k==='zeit')h=`
  <table><tr><th>Epoche</th><th>Zeitraum (Arbeitsblatt)</th><th>Bilder vom Arbeitsblatt</th></tr>${EPO.map(e=>`<tr><td><span class="chip" style="background:${e.col}">${e.n}</span></td><td>${e.z}</td><td>${EBILD.filter(b=>b.c===e.k).map(b=>esc(b.n)).join('<br>')}</td></tr>`).join('')}</table>
  <div id="tl1" style="margin-top:12px"></div>
  <div class="tip"><b>Merksatz Reihenfolge:</b> <b>V</b>iele <b>F</b>rösche <b>A</b>ßen <b>M</b>ittags <b>N</b>udeln – Vorgeschichte, Frühe Hochkulturen, Antike, Mittelalter, Neuzeit.</div>
  <div class="tip"><b>Vor Christus rückwärts zählen:</b> Je größer die Zahl vor Christus, desto länger ist es her: 763 v. Chr. ist früher als 333 v. Chr. Ein Jahr 0 gibt es nicht.</div>
  <div class="tip"><b>Jahrhundert-Trick:</b> Hunderter-Stelle + 1. 1492 → <b>15.</b> Jh. · 14 n. Chr. → <b>1.</b> Jh. · 333 v. Chr. → <b>4.</b> Jh. v. Chr. · 763 v. Chr. → <b>8.</b> Jh. v. Chr.<br><b>Ausnahme:</b> Volle Hunderter beenden ein Jahrhundert: 1500 gehört noch zum 15., 1501 schon zum 16. Jahrhundert.</div>
  <div class="tip"><b>Daten auf deiner Zeitleiste:</b> 763 v. Chr. · 333 v. Chr. (Alexander der Große siegt bei Issos) · 14 n. Chr. (Kaiser Augustus stirbt) · 1492 (Kolumbus erreicht Amerika)</div>`;
  if(k==='leben')h=`
  <p>Die Menschen der Altsteinzeit waren <b>Jäger und Sammler</b>. Sie hatten keinen festen Wohnort und zogen den <b>Tierherden</b> hinterher (<b>Nomaden</b>). Werkzeuge stellten sie aus <b>Stein</b>, Knochen, Holz und Geweih her. Nach erfolgreicher Jagd verwendeten sie fast alles vom erlegten Tier:</p>
  <table><tr><th>🦣 Teil des Mammuts</th><th>Verwendung</th></tr>${MAMMUT.map(m=>`<tr><td><b>${esc(m.teil)}</b></td><td>${esc(m.use.join(', ').replace('Nahrung (Fett)','Nahrung'))}</td></tr>`).join('')}</table>
  <h2>Archäologische Fundstücke im Grabungsfeld</h2><p>Archäologinnen und Archäologen erforschen die Vergangenheit durch <b>Ausgrabungen</b>. Ihre Fundstücke sind <b>Sachquellen</b>.</p>
  <table><tr><th></th><th>Gerät</th><th>Wozu wurde es gebraucht?</th></tr>${GERAET.map(g=>`<tr><td><b>${g.k}</b></td><td><b>${esc(g.n)}</b></td><td>${esc(g.use)}</td></tr>`).join('')}</table>
  <div class="tip warn">Beim <b>S</b> ist auf dem Arbeitsblatt nicht eindeutig zu erkennen, ob eine <b>Speerschleuder</b> oder eine <b>Speerspitze</b> gemeint ist – beides gehört zur Jagd mit dem Speer. Frag im Zweifel die Lehrkraft.</div>`;
  if(k==='wohnen')h=`
  <h2>Beschreibung der beiden Bilder</h2>
  <table><tr><th>🪨 Höhle (linkes Bild)</th><th>🛖 Zelte (rechtes Bild)</th></tr>
  <tr><td>Die Menschen leben in einer Höhle unter Felsen.</td><td>Die Menschen leben in Zelten aus Tierfellen über Holzstangen oder Mammutknochen.</td></tr>
  <tr><td>Feuerstelle: Wärme, Licht, Schutz, Braten</td><td>Feuerstelle im Lager</td></tr>
  <tr><td>Zusammenarbeit bei Beschaffung und Bearbeitung der Nahrung</td><td>Zusammenarbeit bei Fellbearbeitung und Werkzeugherstellung</td></tr></table>
  <h2>Unterschiede</h2>
  <table><tr><th></th><th>🪨 Höhle</th><th>🛖 Zelt</th></tr>
  <tr><td><b>Entstehung</b></td><td>natürlich entstanden</td><td>von Menschen gebaut</td></tr>
  <tr><td><b>Ort</b></td><td>bleibt am Ort (ortsgebunden)</td><td>abbaubar und mitnehmbar</td></tr>
  <tr><td><b>Wo?</b></td><td>nur im Gebirge mit Felsen</td><td>überall, auch im flachen Land</td></tr>
  <tr><td><b>Schutz</b></td><td>fester Schutz vor Wetter und Tieren</td><td>schwächerer Schutz bei Sturm und Kälte</td></tr></table>
  <h2>Vor- und Nachteile</h2>
  <table><tr><th></th><th>👍 Vorteile</th><th>👎 Nachteile</th></tr>
  <tr><td><b>Höhle</b></td><td>${HZ_VN.filter(x=>x.c==='HV').map(x=>esc(x.n)).join('<br>')}</td><td>${HZ_VN.filter(x=>x.c==='HN').map(x=>esc(x.n)).join('<br>')}</td></tr>
  <tr><td><b>Zelt</b></td><td>${HZ_VN.filter(x=>x.c==='ZV').map(x=>esc(x.n)).join('<br>')}</td><td>${HZ_VN.filter(x=>x.c==='ZN').map(x=>esc(x.n)).join('<br>')}</td></tr></table>
  <h2>Wo kamen sie vor? (Aufgabe 4)</h2>
  <div class="tip"><b>Schweiz</b> (vor ca. 50 000 Jahren) → <b>linkes Bild, Höhle</b>: In der Schweiz gibt es Gebirge mit Felsen und Höhlen.<br><b>Schleswig-Holstein</b> (vor ca. 14 000 Jahren) → <b>rechtes Bild, Zelte</b>: Das Land ist flach und liegt am Meer – dort gibt es keine Höhlen.</div>
  <h2>Beurteilung (Aufgabe 3)</h2>
  <div class="tip">Jäger und Sammler mussten den Tierherden folgen. <b>Zelte</b> konnte man abbauen, mitnehmen und überall aufstellen – deshalb waren sie <b>besser geeignet</b>. Höhlen boten zwar guten Schutz, man war aber an den Ort gebunden und fand sie nur im Gebirge.</div>`;
  app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>${c.ic} ${esc(c.n)}</h1></header><div class="card learn">${h}</div>
  <button class="btn next" id="go">✏️ Jetzt dieses Kapitel üben</button>`;
  $('#back').onclick=home;$('#go').onclick=()=>runSet(c.n,TASKS.filter(t=>t.ch===k).map(t=>t.id));
  if(k==='zeit'){const t=timeline($('#tl1'),{bands:true});[[-763,'763 v.'],[-333,'333 v.'],[14,'14 n.'],[1492,'1492']].forEach(([y,l],i)=>t.mark(y,'#1b4fc0',l,i%2===0));}
  window.scrollTo(0,0);
}

/* =========================================================
   BEGRIFFE (Karteikarten) je Kapitel
   ========================================================= */
function showCards(k){
  disarm();
  const app=$('#app');const c=chOf(k);let deck=shuffle(CARDS[k]),i=0;
  function draw(){
    const d=deck[i];
    app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>🃏 ${esc(c.n)}</h1></header>
    <div class="card"><div class="qhead"><span>Karte ${i+1} von ${deck.length}</span><span>Antippen zum Umdrehen</span></div>
    <div class="flip" id="fl"><div class="in"><div class="f"><div class="big">${esc(d[0])}</div><div class="muted" style="margin-top:6px">Was bedeutet das?</div></div><div class="b"><div class="mid">${esc(d[1])}</div></div></div></div>
    <div class="row"><button class="btn sec" id="no">🤔 Nochmal</button><button class="btn" id="yes">✅ Wusste ich</button></div></div>`;
    $('#back').onclick=home;$('#fl').onclick=()=>$('#fl').classList.toggle('on');
    const go=ok=>{if(!ok)deck.push(d);i++;if(i>=deck.length){toast('Alle Begriffe geschafft! 🎉');deck=shuffle(CARDS[k]);i=0;}draw();};
    $('#yes').onclick=()=>go(true);$('#no').onclick=()=>go(false);
  }
  draw();
}

/* =========================================================
   LERNSTAND
   ========================================================= */
function showStats(){
  disarm();
  const app=$('#app');const last=DB.sessions.slice(-8).reverse();
  const tname=t=>{const x=inst(t.id);return x.type==='free'?x.f.q:x.title;};
  app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>📊 Mein Lernstand</h1></header>
  ${CH.map((c,i)=>{const ts=TASKS.filter(t=>t.ch===c.k);const s=chStat(c.k);return `<div class="card"><h2 style="margin-top:0">${c.ic} ${i+1}. ${esc(c.n)} <span class="muted">${s.m}/${s.n}</span></h2>
  ${ts.map(t=>{const h=(DB.tasks[t.id]||{h:[]}).h;const st=mastered(t.id)?'✅':weak(t.id)?'🔥':h.length?'🟡':'⚪';return `<div class="trow">${st} ${esc(tname(t))}${h.length?` <span class="muted">(zuletzt ${Math.round(h[h.length-1]*100)} %)</span>`:''}</div>`;}).join('')}</div>`;}).join('')}
  <div class="card"><p class="muted" style="margin-top:0">✅ sitzt · 🟡 angefangen · 🔥 noch Fehler · ⚪ noch nicht geübt</p><h2>Letzte Übungen</h2>${last.length?`<table><tr><th>Wann</th><th>Übung</th><th>Punkte</th></tr>${last.map(s=>`<tr><td>${new Date(s.d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} ${new Date(s.d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(s.m)}</td><td>${s.p}/${s.n} (${Math.round(s.p/s.n*100)} %)</td></tr>`).join('')}</table>`:'<p class="muted">Noch keine Übung gemacht.</p>'}
  <button class="btn sec small" id="reset" style="margin-top:12px">Lernstand zurücksetzen</button></div>`;
  $('#back').onclick=home;
  $('#reset').onclick=()=>{if(confirm('Wirklich den ganzen Lernstand löschen?')){DB.tasks={};DB.sessions=[];save();showStats();}};
  window.scrollTo(0,0);
}
home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
