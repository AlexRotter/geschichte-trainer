<style>
:root{
  --bg:#eef4ff; --card:#fff; --ink:#1b2540; --muted:#5b6785; --line:#d6dff0;
  --blue:#2a6df4; --blue-d:#1b4fc0; --ok:#1f9d55; --ok-bg:#e3f6ea; --bad:#d63b3b; --bad-bg:#fde8e8;
  --warn:#b7791f; --warn-bg:#fff5df; --sea:#cfe4f7; --land:#ffffff; --other:#e4e4e4;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
header h1{font-size:1.3rem;margin:0;flex:1}
.btn{appearance:none;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:12px 16px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.sec{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn.small{padding:7px 12px;font-size:.9rem;border-radius:10px}
.btn.ghost{background:transparent;color:var(--blue);padding:8px 10px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(20,40,90,.08);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:88px}
.tile:hover{border-color:var(--blue)}
.tile b{font-size:1rem}
.tile span{color:var(--muted);font-size:.85rem}
.tile .ic{font-size:1.5rem;line-height:1}
.tile.hi{border-color:var(--blue);background:#f2f7ff}
h2{font-size:1.1rem;margin:18px 0 8px}
.muted{color:var(--muted)}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;font:inherit;padding:9px 6px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.settings{display:flex;flex-direction:column;gap:8px}
.settings label{font-size:.85rem;color:var(--muted);font-weight:600}
.progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.prompt{font-size:1.25rem;font-weight:700;margin:6px 0 12px}
.prompt small{display:block;font-size:.9rem;font-weight:500;color:var(--muted);margin-top:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink);touch-action:manipulation}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.txt{display:flex;gap:8px}
.txt input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px;border:2px solid var(--line);border-radius:12px}
.txt input:focus{outline:none;border-color:var(--blue)}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-weight:600;display:none}
.fb.ok{display:block;background:var(--ok-bg);color:#166b3b}
.fb.bad{display:block;background:var(--bad-bg);color:#9b2020}
.fb.warn{display:block;background:var(--warn-bg);color:#7a4e0e}
.fb .ex{font-weight:400;margin-top:4px;color:var(--ink)}
.next{margin-top:12px;width:100%}
.mapbox{position:relative;background:var(--sea);border-radius:14px;overflow:hidden;border:2px solid var(--line);margin-bottom:12px;touch-action:pan-y}
.mapbox.zoomed{touch-action:none}
.mapbox svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mapbox .zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapbox .zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:1.3rem;font-weight:700;color:var(--ink);cursor:pointer}
.mapbox .hint{position:absolute;left:8px;bottom:6px;font-size:.75rem;color:var(--muted);background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px}
path.c{fill:var(--land);stroke:#4a5568;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
path.c.tap:hover{fill:#eaf1ff}
path.o{fill:var(--other);stroke:#b5b5b5;stroke-width:.5;vector-effect:non-scaling-stroke}
path.c.dim{fill:#f4f6fa}
path.c.hl{fill:#ffcf3f}
path.c.ok{fill:#5cc98a}
path.c.bad{fill:#f08080}
.sea circle{fill:#fff;stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke}
.sea text{font-weight:800;fill:var(--blue-d);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sea.tap{cursor:pointer}
.sea.hl circle{fill:#ffcf3f;stroke:#b7791f}
.sea.ok circle{fill:#5cc98a;stroke:var(--ok)}
.sea.bad circle{fill:#f08080;stroke:var(--bad)}
.sea.dim{opacity:.35}
.lbl{font-weight:700;fill:#1b2540;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.8rem;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tip{border-left:4px solid var(--blue);background:#f2f7ff;padding:10px 12px;border-radius:8px;margin:8px 0}
.tip.warn{border-color:var(--warn);background:var(--warn-bg)}
.flip{perspective:900px;cursor:pointer;margin:6px 0 12px}
.flip .in{position:relative;min-height:170px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px;text-align:center}
.flip .f{background:#fff;border:2px solid var(--line)}
.flip .b{background:#f2f7ff;border:2px solid var(--blue);transform:rotateY(180deg)}
.flip .big{font-size:1.6rem;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.stat{display:flex;align-items:center;gap:10px;margin:8px 0}
.stat .bar{flex:1;height:12px;background:var(--line);border-radius:7px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ok)}
.stat b{min-width:44px;text-align:right}
.stat span{min-width:150px}
.big-res{font-size:2.4rem;font-weight:800;text-align:center;margin:6px 0}
.rev{font-size:.92rem}
.rev .r{padding:8px 0;border-bottom:1px solid var(--line)}
.rev .r.bad b{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2540;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
@media (max-width:420px){.opts{grid-template-columns:1fr}.prompt{font-size:1.12rem}.stat span{min-width:110px}}
.tlbox{background:#fff;border:2px solid var(--line);border-radius:14px;overflow-x:auto;overflow-y:hidden;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tl{display:block;width:100%;min-width:720px;height:auto;user-select:none;-webkit-user-select:none}
.tll{font-size:17px;font-weight:700;fill:#1b2540;text-anchor:middle}
.tlc{font-size:13px;fill:#5b6785;text-anchor:middle}
.tlb{font-size:15px;font-weight:700;fill:#1b2540;text-anchor:middle}
.tlm{font-size:17px;font-weight:800;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px}
textarea{width:100%;font:inherit;font-size:1.05rem;padding:12px;border:2px solid var(--line);border-radius:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--blue)}
.fb.plain{display:block;background:#f2f7ff;color:var(--ink);font-weight:400}
.checks{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-weight:500}
.chk input{width:22px;height:22px;flex:none;margin:0}
.okt{color:#166b3b;font-weight:700;margin-bottom:6px}.badt{color:#9b2020;font-weight:700;margin-bottom:6px}
.chosen{min-height:30px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.chosen .chip{background:#e3ecff;color:var(--blue-d)}
.opt.used{opacity:.4}
.flip .mid{font-size:1.1rem;font-weight:600;line-height:1.4}
ul{margin:4px 0 10px;padding-left:22px}
.chcard{padding:14px}
.chhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.chic{font-size:1.8rem;line-height:1}
.chcard .row .btn{flex:1;min-width:0;padding:10px 6px}
.sortl{display:flex;flex-direction:column;gap:8px}
.srow{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.srow.ok{border-color:var(--ok);background:var(--ok-bg)}
.srow.bad{border-color:var(--bad);background:var(--bad-bg)}
.sitem{font-weight:700;margin-bottom:6px}
.scats{display:flex;flex-wrap:wrap;gap:6px}
.sc{border:2px solid var(--line);background:#f7f9fd;border-radius:999px;padding:6px 11px;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink);cursor:pointer;touch-action:manipulation}
.sc.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sfb{font-size:.85rem;margin-top:4px}
.gtext{font-size:1.05rem;line-height:2.3}
.gap{font:inherit;font-size:1rem;padding:4px 6px;border:2px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
input.gap{width:9.5em}input.gap.num{width:3.2em;text-align:center}
.gap.ok{border-color:var(--ok);background:var(--ok-bg);color:#166b3b}
.gap.bad{border-color:var(--bad);background:var(--bad-bg);color:#9b2020}
.corr{display:inline-block;margin-left:4px;font-weight:700;color:var(--ok);font-size:.95rem}
.pts{float:right;font-weight:700}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}
.trow{padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tlq{margin-bottom:8px;font-size:1.05rem}
.learn h2{margin-top:18px}
.prompt{line-height:1.35}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(238,244,255,.97);box-shadow:0 -4px 18px rgba(20,40,90,.2);max-height:55vh;overflow:auto}
.actbar .fb,.actbar #act{max-width:828px;margin-left:auto;margin-right:auto}
.actbar .fb{margin-top:0}.actbar .next{margin-top:0}
body.hasfb .actbar{cursor:pointer}
.actbar .fb:not(.ok):not(.bad):not(.warn):not(.plain){display:none}
.tapnext{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;color:var(--blue-d);font-size:.95rem;margin-top:8px}
.tapnext span.go{background:var(--blue);color:#fff;border-radius:999px;padding:8px 16px;white-space:nowrap}
body.hasbar .wrap{padding-bottom:110px}body.hasfb .wrap{padding-bottom:58vh}
#fbin.fb{margin-top:12px}
.hero{border:2px solid var(--blue);background:#f2f7ff}
.qhint{background:#f2f7ff;border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;margin:-4px 0 10px;font-size:.95rem}
textarea::placeholder{white-space:pre-line}
details.card summary{cursor:pointer;padding:4px 0}
details.card .chcard{box-shadow:none;border:1px solid var(--line);margin-top:10px}
.chsel{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.chsel label{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:500}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.chain span{background:#f2f7ff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================
   INHALTE – aus Tims Heftseiten (Westermann), Klasse 6
   Teil A (Probe): Altsteinzeit → Jungsteinzeit → Metallzeit
   Teil B (Grundlagen): Quellen, Zeit und Epochen
   ========================================================= */
const CH=[
 {k:'leben',n:'Leben in der Altsteinzeit',ic:'🦣',p:1,d:'Jäger und Sammler, knappes Angebot, Faustkeil, Verwertung der Beute, Fundstücke'},
 {k:'wohnen',n:'Wohnen in der Altsteinzeit',ic:'🛖',p:1,d:'Höhle und Zelt: Unterschiede, Vor- und Nachteile, Schweiz und Schleswig-Holstein'},
 {k:'lager',n:'Altsteinzeitlicher Lagerplatz',ic:'🔥',p:1,d:'Was die Menschen am Lagerplatz tun – die 10 Szenen'},
 {k:'sesshaft',n:'Ackerbau und Viehzucht: Menschen werden sesshaft',ic:'🌾',p:1,d:'Klimaerwärmung, Sesshaftigkeit, Ackerbau, Viehzucht, Ausbreitung'},
 {k:'vergleich',n:'Arbeit und Ernährung: Alt- und Jungsteinzeit',ic:'⚖️',p:1,d:'Wohnen, Kleidung, Ernährung, Werkzeuge im Vergleich'},
 {k:'erfindungen',n:'Erfindungen der Jungsteinzeit',ic:'🏺',p:1,d:'Ackerbau, Hausbau, Töpferei, Viehzucht, Hakenpflug, Steinbohrung'},
 {k:'bronze',n:'Die Bronzezeit',ic:'⚒️',p:1,d:'Kupfer gewinnen in 5 Arbeitsschritten, Bronze = Kupfer + Zinn'},
 {k:'kelten',n:'Die Metallzeit und die Kelten',ic:'🛡️',p:1,d:'Vorteile der Metalle, neues Zusammenleben, keltische Spuren'},
 {k:'hochdorf',n:'Das Fürstengrab von Hochdorf',ic:'👑',p:1,d:'Grab eines Keltenfürsten: Aufbau und Grabbeigaben'},
 {k:'quellen',n:'Geschichtliche Quellen',ic:'📜',p:0,d:'Grundlagen: Quellenarten, Probleme, Darstellungen'},
 {k:'zeit',n:'Zeit und Epochen',ic:'🏛️',p:0,d:'Grundlagen: Epochen, Zeitleiste, Jahrhunderte'}
];
const RF=[{k:'R',n:'richtig'},{k:'F',n:'falsch'}];
const tf=a=>a.map(x=>({n:x[0],c:x[1]?'R':'F',hint:x[2]||''}));
const P=(a)=>a.map(x=>({n:x[0],c:x[1],alt:x[2]||[],hint:x[3]||''}));

/* ---------- Grundlagen-Daten (frühere Probe) ---------- */
const QT={S:{n:'Schriftliche Quellen',s:'Schrift',d:'etwas Geschriebenes'},M:{n:'Mündliche Quellen',s:'mündlich',d:'etwas Erzähltes oder Gesprochenes'},B:{n:'Bildquellen',s:'Bild',d:'ein Bild'},Sa:{n:'Sachquellen',s:'Sache',d:'ein Gegenstand, Gebäude oder Überrest'}};
const QUELLEN=P([['Tagebücher','S'],['Urkunden','S'],['Verträge','S'],['Briefe','S'],['Gesetze','S'],['Zeitung','S'],['Testament','S'],['Inschriften','S',['Sa'],'Eine Inschrift ist Geschriebenes – sie steht aber auf einem Gegenstand.'],
 ['Sagen','M',['S'],'Sagen wurden zuerst erzählt und erst später aufgeschrieben.'],['Erzählung','M'],['Erinnerungen','M',['S'],'Erzählte Erinnerungen sind mündlich – aufgeschrieben werden sie zur Schriftquelle.'],['Mythen','M',['S'],'Mythen wurden lange nur erzählt.'],['Interview','M'],['Tonbandaufzeichnungen','M'],['Legenden','M',['S'],'Legenden wurden mündlich weitererzählt.'],
 ['Zeichnungen','B'],['Höhlenmalerei','B'],['Fotos','B'],['Gemälde','B'],['Karten','B',['S'],'Karten sind gezeichnet – sie enthalten aber oft auch Schrift.'],
 ['Kutsche','Sa'],['Möbel','Sa'],['Grabsteine','Sa',['S'],'Ein Grabstein ist ein Gegenstand – die Inschrift darauf ist Geschriebenes.'],['Knochenreste','Sa'],['Ruinen','Sa'],['Münzen','Sa'],['Lanzen','Sa'],['Uniform','Sa'],['Schiffswrack','Sa'],['Gefäße','Sa'],['Trachten','Sa'],['Pistolen','Sa'],['Gebäude','Sa'],['Fossilien','Sa']]);
const EPO=[
 {k:'VG',n:'Vorgeschichte',z:'bis 2000 v. Chr.',von:-99999,bis:-2000,col:'#6cc7c2'},
 {k:'HK',n:'Frühe Hochkulturen',z:'2000 v. Chr. – 500 v. Chr.',von:-2000,bis:-500,col:'#f2e85c'},
 {k:'AN',n:'Antike',z:'500 v. Chr. – 500 n. Chr.',von:-500,bis:500,col:'#c79be0'},
 {k:'MA',n:'Mittelalter',z:'500 n. Chr. – 1500 n. Chr.',von:500,bis:1500,col:'#f08a80'},
 {k:'NZ',n:'Neuzeit',z:'ab 1500 n. Chr.',von:1500,bis:99999,col:'#8fd48f'}];
const EK=Object.fromEntries(EPO.map(e=>[e.k,e]));
const yTxt=y=>y<0?`${-y} v. Chr.`:`${y} n. Chr.`;

/* ---------- Aufgaben ----------
   Jede Aufgabe besteht aus „Lerninhalten" (Items), die einzeln gezählt werden:
   sort: jede Zeile · gaps: jede Lücke · timeline: jedes Datum · order/mc/free: die ganze Aufgabe
   whole:true = Aufgabe zählt als ein Lerninhalt (zufällig gemischte Lücken) */
const FREEQ={};
const T=[
// ===== 1 Leben in der Altsteinzeit =====
 {id:'l_angebot',ch:'leben',type:'gaps',title:'Knappes Angebot: Ergänze.',tpl:'Die Menschen der Altsteinzeit hatten nur ein knappes Angebot an …<br>• {0} Nahrung, z. B. Nüsse, Beeren, {1}<br>• {2} Nahrung: Die Tierherden zogen auf der Suche nach {3} umher.<br>• {4}: Das Feuer brauchte man als Wärmequelle, als Schutz vor Tieren und für die Zubereitung der Nahrung.',
  gaps:[{acc:['pflanzlicher','pflanzliche']},{acc:['Wildgetreide']},{acc:['fleischlicher','fleischliche']},{acc:['Futter']},{acc:['Brennholz','Holz']}],bank:['Kartoffeln','Brot','Wasser']},
 {id:'l_jagen',ch:'leben',type:'gaps',title:'Jagen und Sammeln: Ergänze.',tpl:'Die Menschen folgten den {0}. Sie gingen in Gebiete, wo essbare {1} vorhanden waren. Sie zogen also von {2} zu Ort. Solche Menschen nennt man {3}. Das Umherziehen sicherte das {4} der Menschen.',
  gaps:[{acc:['Tierherden','Herden']},{acc:['Pflanzen']},{acc:['Ort']},{acc:['Nomaden']},{acc:['Leben','Überleben']}],bank:['Bauern','Häusern','Stadt']},

/* =========================================================
   SPEICHER – Lernstand je Lerninhalt, nur in diesem Browser
   b = Stufe (0 = falsch/neu gelernt … 5 = sehr sicher), sitzt ab Stufe 2
   ========================================================= */
const LS_KEY='geschichte-trainer-v3';
let DB={it:{},sessions:[],set:{answer:'mc',chs:CH.filter(c=>c.p).map(c=>c.k)},sess:0};
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&s.it)DB=Object.assign(DB,s);}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}}
function rec(k,ok){const s=DB.it[k]||(DB.it[k]={b:0,n:0,w:0});s.n++;s.t=Date.now();s.s=DB.sess;if(ok)s.b=Math.min(5,s.b+1);else{s.b=0;s.w++;}}
const sure=k=>{const s=DB.it[k];return !!(s&&s.b>=2);};
const shaky=k=>{const s=DB.it[k];return !!(s&&s.n&&s.b<2&&s.w>0);};
function prio(k){const s=DB.it[k];if(!s)return 4;if(s.b===0)return s.w?6:4;if(s.b===1)return 3;const old=DB.sess-(s.s||0);return (s.b===2?1.2:.4)+(old>=2?.6:0);}

/* ---------- Lerninhalte einer Aufgabe ---------- */
function itemsOf(d){
  if(d.type==='sort')return d.pool.map((_,i)=>d.id+':'+i);
  if(d.type==='gaps')return d.whole?[d.id]:d.gaps.map((_,i)=>d.id+':g'+i);
  if(d.type==='timeline')return d.targets.map((_,i)=>d.id+':t'+i);
  return [d.id];
}
function itemLabel(k){const [id,sub]=k.split(':');const d=TK[id];if(!d)return k;
  if(d.type==='sort'){const r=d.pool[+sub];return `${r.n} → ${d.cats.find(c=>c.k===r.c).n}`;}
  if(d.type==='gaps'&&sub)return `${d.title.replace(/[:.]?\s*(Ergänze.*)?$/,'')}: „${d.gaps[+sub.slice(1)].acc[0]}"`;
  if(d.type==='timeline'&&sub)return `Zeitleiste: ${d.targets[+sub.slice(1)].label}`;
  return d.type==='free'||d.type==='mc'?d.q:d.title;}
const chItems=k=>T.filter(d=>d.ch===k).flatMap(itemsOf);

/* ---------- Hilfsfunktionen ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}
const n1=s=>s.toLowerCase().trim().replace(/\s+/g,' ').replace(/^(die|der|das|ein|eine|einem|einen)\s+/,'');
const n2=s=>n1(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[\s\-.]/g,'');
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function checkText(input,answers){
  if(!input.trim())return 'bad';
  if(answers.some(a=>n1(a)===n1(input)))return 'ok';
  if(answers.some(a=>n2(a)===n2(input)))return 'umlaut';
  const x=n2(input);
  if(answers.some(a=>{const y=n2(a);return y.length>3&&lev(x,y)<=Math.max(1,Math.min(3,Math.floor(y.length/4)));}))return 'near';
  return 'bad';}
const useText=()=>DB.set.answer==='text';
const chOf=k=>CH.find(c=>c.k===k);

/* ---------- Aufgabe instanziieren (sel = gewünschte Zeilen) ---------- */
function inst(id,sel){const d=TK[id];const t=Object.assign({},d);
  if(d.type==='sort'){let idx=sel&&sel.length?sel:shuffle(d.pool.map((_,i)=>i)).slice(0,d.rows||d.pool.length);t.rows=shuffle(idx).map(i=>Object.assign({key:d.id+':'+i},d.pool[i]));}
  if(d.type==='mc')t.options=shuffle([d.a,...d.wrong]);
  return t;}

/* ---------- Zeitleiste ---------- */
const TL={min:-1000,max:2100,x0:44,x1:956};
const tx=y=>TL.x0+(y-TL.min)/(TL.max-TL.min)*(TL.x1-TL.x0);
function timeline(box,o={}){
  const H=o.bands?150:118;
  let s=`<svg viewBox="0 0 1000 ${H}" class="tl"><rect x="0" y="0" width="1000" height="${H}" fill="#fff"/>`;
  if(o.bands)EPO.forEach(e=>{const a=tx(Math.max(e.von,TL.min)),b=tx(Math.min(e.bis,TL.max));if(b<=a)return;s+=`<rect x="${a}" y="100" width="${b-a}" height="44" fill="${e.col}"/><text x="${(a+b)/2}" y="127" class="tlb">${e.n.replace('Frühe ','')}</text>`;});
  s+=`<g class="bands"></g><rect x="${TL.x0}" y="44" width="${TL.x1-TL.x0}" height="20" rx="4" fill="#e8ecf5" stroke="#8a94ad" fill-opacity=".85"/>`;
  for(let y=-1000;y<=2100;y+=100){const x=tx(y);const big=y%500===0;s+=`<line x1="${x}" y1="${big?36:44}" x2="${x}" y2="${big?72:64}" stroke="#4a5568" stroke-width="${big?2:1}"/>`;
    if(big)s+=`<text x="${x}" y="28" class="tll">${y<0?-y+' v.':y===0?'Chr. Geb.':y}</text>`;
    if(y<2100){const c=y<0?(-y)/100:y/100+1;s+=`<text x="${tx(y+50)}" y="88" class="tlc">${c}.</text>`;}}
  s+=`<line x1="${tx(0)}" y1="10" x2="${tx(0)}" y2="${H-8}" stroke="#d63b3b" stroke-width="2.5"/><g class="marks"></g></svg>`;
  box.innerHTML=s;box.classList.add('tlbox');
  const svg=box.querySelector('svg'),g=svg.querySelector('.marks');
  if(o.onTap){svg.style.cursor='crosshair';svg.addEventListener('click',e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());const y=Math.round(TL.min+(q.x-TL.x0)/(TL.x1-TL.x0)*(TL.max-TL.min));o.onTap(Math.max(TL.min,Math.min(TL.max,y)));});}
  return{mark(y,col,t,up){const x=tx(y);g.insertAdjacentHTML('beforeend',`<g><line x1="${x}" y1="38" x2="${x}" y2="70" stroke="${col}" stroke-width="4"/><text x="${x}" y="${up?14:108}" class="tlm" fill="${col}">✕ ${esc(t||'')}</text></g>`);},clear(){g.innerHTML='';}};
}

/* ---------- Leiste unten: Prüfen, danach Erklärung; Tippen irgendwo = weiter ---------- */
let armed=null;
function unlisten(){if(armed){document.removeEventListener('click',armed.c,true);document.removeEventListener('keydown',armed.k,true);clearTimeout(armed.t);armed=null;}}
function disarm(){unlisten();const b=document.getElementById('actbar');if(b)b.remove();document.body.classList.remove('hasbar','hasfb');}
function armNext(fn){unlisten();const c=e=>{if(e.target.closest('#back'))return;e.preventDefault();e.stopPropagation();unlisten();fn();};
  const k=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();unlisten();fn();}};
  armed={c,k};armed.t=setTimeout(()=>{if(armed&&armed.c===c){document.addEventListener('click',c,true);document.addEventListener('keydown',k,true);}},250);}

/* =========================================================
   AUFGABE ANZEIGEN – meldet res=[{k,ok}], pts, max zurück
   ========================================================= */
function renderTask(box,t,onDone,exam){
  disarm();
  box.innerHTML=`<div class="prompt">${esc(t.type==='free'||t.type==='mc'?t.q:t.title)}</div><div class="tbody"></div><div id="fbin"></div>`;
  const bar=document.createElement('div');bar.id='actbar';bar.className='actbar';bar.innerHTML='<div class="fb" id="fb"></div><div id="act"></div>';
  document.body.appendChild(bar);document.body.classList.add('hasbar');

  const btn=(txt,fn)=>{act.innerHTML=`<button class="btn next">${txt}</button>`;act.querySelector('button').onclick=fn;};
  const done=(res,pts,max)=>{disarm();onDone(res,pts,max);};
  const headline=(pts,max)=>`${pts/max>=.8?'Gut gemacht! ✅':'Schau dir die markierten Stellen noch einmal an.'} <span class="pts">${Math.round(pts*10)/10} von ${max} Punkten</span>`;
  const finish=(res,pts,max,html)=>{if(exam){done(res,pts,max);return;}fb.className='fb '+(pts/max>=.8?'ok':'bad');fb.innerHTML=html;document.body.classList.add('hasfb');
    act.innerHTML='<div class="tapnext"><span>👆 Tippe irgendwo für weiter</span><span class="go">Weiter ›</span></div>';armNext(()=>done(res,pts,max));};

  if(t.type==='sort'){
    const sel={};
    body.innerHTML=`<div class="sortl">${t.rows.map((it,i)=>`<div class="srow" data-i="${i}"><div class="sitem">${esc(it.n)}</div><div class="scats">${t.cats.map(c=>`<button class="sc" data-c="${c.k}">${esc(c.n)}</button>`).join('')}</div><div class="sfb"></div></div>`).join('')}</div>`;
    body.querySelectorAll('.srow').forEach(r=>r.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{if(r.dataset.done)return;r.querySelectorAll('.sc').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel[r.dataset.i]=b.dataset.c;}));
    btn('Prüfen',()=>{
      if(Object.keys(sel).length<t.rows.length){toast('Ordne erst alle zu 🙂');return;}
      let pts=0;const hints=[],res=[];
      t.rows.forEach((it,i)=>{const r=body.querySelector(`.srow[data-i="${i}"]`);r.dataset.done=1;const v=sel[i];const ok=v===it.c||(it.alt||[]).includes(v);if(ok)pts++;res.push({k:it.key,ok});
        r.classList.add(ok?'ok':'bad');const cn=t.cats.find(c=>c.k===it.c).n;
        r.querySelector('.sfb').innerHTML=ok?((it.alt||[]).includes(v)?`✔ gilt auch – meist: <b>${esc(cn)}</b>`:'✔'):`✘ richtig: <b>${esc(cn)}</b>`;
        if(it.hint&&(!ok||v!==it.c))hints.push(it.hint);});
      finish(res,pts,t.rows.length,headline(pts,t.rows.length)+(hints.length?`<div class="ex">${hints.map(esc).join('<br>')}</div>`:'')+(t.ex?`<div class="ex">${esc(t.ex)}</div>`:''));
    });
  }
  else if(t.type==='gaps'){
    const bank=shuffle([...new Set([...t.gaps.filter(g=>!g.sel&&!g.num).map(g=>g.acc[0]),...(t.bank||[])])]);
    const html=esc(t.tpl).replace(/&lt;br&gt;/g,'<br>').replace(/&lt;(\/?)b&gt;/g,'<$1b>').replace(/\{(\d+)\}/g,(m,i)=>{const g=t.gaps[+i];
      if(g.num)return `<input class="gap num" data-g="${i}" inputmode="numeric" autocomplete="off">`;
      if(g.sel||!useText())return `<select class="gap" data-g="${i}"><option value="">…</option>${(g.opts?g.opts:bank).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
      return `<input class="gap" data-g="${i}" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off">`;});
    body.innerHTML=`<div class="gtext">${html}</div>`;
    btn('Prüfen',()=>{
      const els=[...body.querySelectorAll('.gap')];if(els.some(e=>!e.value.trim())){toast('Fülle erst alle Lücken aus 🙂');return;}
      let pts=0;const notes=[],res=[];const used=new Set();
      els.forEach(e=>{const gi=+e.dataset.g,g=t.gaps[gi];
        const grp=(t.anyPairs||[]).find(p=>p.includes(gi))||[gi];
        const test=(acc)=>(e.tagName==='SELECT'||g.num)?(acc.some(a=>n1(a)===n1(e.value))?'ok':'bad'):checkText(e.value,acc);
        let r='bad',hit=null;for(const j of grp){if(used.has(j))continue;const x=test(t.gaps[j].acc);if(x==='ok'||x==='umlaut'){r=x;hit=j;break;}if(x==='near'&&r==='bad')r='near';}
        if(hit!==null)used.add(hit);
        const ok=r==='ok'||r==='umlaut';if(ok)pts++;e.disabled=true;e.classList.add(ok?'ok':'bad');res.push({k:t.whole?t.id:t.id+':g'+gi,ok});
        if(!ok)e.insertAdjacentHTML('afterend',`<span class="corr">${esc(g.acc[0])}</span>`);
        if(r==='umlaut')notes.push(`Schreibweise: ${g.acc[0]}`);if(r==='near')notes.push(`Fast – achte auf die Schreibweise: ${g.acc[0]}`);});
      if(t.whole)res.splice(0,res.length,{k:t.id,ok:pts/els.length>=.8});
      finish(res,pts,els.length,headline(pts,els.length)+(notes.length?`<div class="ex">${notes.map(esc).join('<br>')}</div>`:'')+(t.ex?`<div class="ex">${esc(t.ex)}</div>`:''));
    });

  else if(t.type==='mc'){
    let v=null;
    body.innerHTML=`<div class="opts one">${t.options.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(v!==null)return;v=b.textContent;const ok=v===t.a;
      body.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===t.a)x.classList.add('ok');});if(!ok)b.classList.add('bad');
      finish([{k:t.id,ok}],ok?1:0,1,headline(ok?1:0,1)+(ok?'':`<div class="ex">Richtig: <b>${esc(t.a)}</b></div>`)+(t.ex?`<div class="ex">${esc(t.ex)}</div>`:''));});
    act.innerHTML='<div class="tapnext"><span class="muted">Tippe auf eine Antwort</span></div>';
  }
  else if(t.type==='order'){
    const chosen=[];const items=shuffle(t.items);
    body.innerHTML=`<div class="chosen" id="ch"></div><div class="opts one">${items.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div><button class="btn ghost small" id="undo">↺ Neu anfangen</button>`;
    const draw=()=>{body.querySelector('#ch').innerHTML=chosen.length?chosen.map((s,i)=>`<span class="chip">${i+1}. ${esc(s)}</span>`).join(' '):'<span class="muted">Tippe der Reihe nach an …</span>';};draw();
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;chosen.push(b.textContent);b.disabled=true;b.classList.add('used');draw();});
    body.querySelector('#undo').onclick=()=>{chosen.length=0;body.querySelectorAll('.opt').forEach(b=>{b.disabled=false;b.classList.remove('used');});draw();};
    btn('Prüfen',()=>{if(chosen.length<t.items.length){toast('Tippe erst alle an 🙂');return;}
      body.querySelector('#undo').remove();let pos=0;chosen.forEach((c,i)=>{if(c===t.items[i])pos++;});const pts=pos===t.items.length?2:pos>=t.items.length-2?1:0;
      finish([{k:t.id,ok:pts===2}],pts,2,headline(pts,2)+`<div class="ex">Richtig: <b>${t.items.map(esc).join(' → ')}</b></div>`+(t.ex?`<div class="ex">${esc(t.ex)}</div>`:''));});
  }
  else if(t.type==='timeline'){
    let i=0;const taps=[];
    body.innerHTML=`<div class="tlq">Jetzt eintragen: <b id="cur">${esc(t.targets[0].label)}</b> <span class="muted" id="cnt">(1 von ${t.targets.length})</span></div><div id="tlc"></div><p class="muted" style="margin:6px 0 0;font-size:.85rem">Die rote Linie ist Christi Geburt – links davon „vor Christus". Auf dem Handy kannst du die Zeitleiste seitlich wischen.</p>`;
    const tl=timeline(body.querySelector('#tlc'),{onTap:y=>{if(i>=t.targets.length)return;taps.push(y);tl.mark(y,'#2a6df4',t.targets[i].label,i%2===0);i++;
      if(i<t.targets.length){body.querySelector('#cur').textContent=t.targets[i].label;body.querySelector('#cnt').textContent=`(${i+1} von ${t.targets.length})`;}else body.querySelector('.tlq').innerHTML='Alle eingetragen – jetzt prüfen.';}});

      tl.clear();let pts=0;const lines=[],res=[];
      t.targets.forEach((g,k)=>{const y=taps[k];const ok=Math.abs(y-g.y)<=80;tl.mark(g.y,'#1f9d55',g.label,k%2===0);if(!ok)tl.mark(y,'#d63b3b','',false);
        if(ok)pts++;res.push({k:t.id+':t'+k,ok});lines.push(`${ok?'✔':'✘'} ${esc(g.label)}${ok?'':` – du hast bei ${yTxt(y)} getippt`}`);});

  }
  else if(t.type==='free'){
    body.innerHTML=`${t.hint?`<div class="qhint">${t.hint}</div>`:''}<textarea id="fa" rows="6" placeholder="${esc(t.ph||'Schreibe deine Antwort in Stichpunkten oder ganzen Sätzen – wie in der Probe …')}"></textarea>`;
    btn('Fertig – mit Musterantwort vergleichen',()=>{const v=body.querySelector('#fa').value;if(!v.trim()){toast('Schreib erst deine Antwort 🙂');return;}

      fbi.scrollIntoView({behavior:'smooth',block:'start'});
      btn('Bewerten ›',()=>{const n=[...fbi.querySelectorAll('input:checked')].length;fbi.querySelectorAll('input').forEach(x=>x.disabled=true);const pts=Math.min(n,t.need);
        finish([{k:t.id,ok:pts>=t.need}],pts,t.need,headline(pts,t.need)+'<div class="ex">Die Musterpunkte stehen oben unter deiner Antwort.</div>');});});
  }
}

/* =========================================================
   ABLÄUFE: Training (adaptiv), Kapitel üben, Probearbeit
   ========================================================= */
// Training: zuerst Neues und Fehler, Sicheres selten; Kapitel wechseln sich ab; Fehler kommen 3 Aufgaben später erneut
function startTraining(){
  DB.sess=(DB.sess||0)+1;save();
  const chs=DB.set.chs.length?DB.set.chs:CH.filter(c=>c.p).map(c=>c.k);
  const pool=T.filter(d=>chs.includes(d.ch));const used=new Set();const queue=[];let step=0,lastCh=null,lastId=null;
  const N=10;
  function next(){
    if(step>=N)return null;
    const avoid=chs.length>1?lastCh:null;
    const due=queue.findIndex(q=>q.due<=step&&TK[q.id].ch!==avoid);
    if(due>=0){const q=queue.splice(due,1)[0];return {id:q.id,sel:q.sel,again:1};}
    let cand=pool.filter(d=>!used.has(d.id)&&d.ch!==avoid);if(!cand.length)cand=pool.filter(d=>d.ch!==avoid&&d.id!==lastId);if(!cand.length)cand=pool;
    const scored=cand.map(d=>{const ps=itemsOf(d).map(prio);const mx=Math.max(...ps),avg=ps.reduce((a,b)=>a+b,0)/ps.length;
      return {d,s:(mx+avg*.5)*(d.type==='free'?.75:1)+Math.random()*.6};}).sort((a,b)=>b.s-a.s);
    const c=scored[0];if(!c)return null;
    const d=c.d;let sel=null;
    if(d.type==='sort'){const want=d.rows||d.pool.length;const ord=d.pool.map((_,i)=>({i,p:prio(d.id+':'+i)+Math.random()*.5})).sort((a,b)=>b.p-a.p);
      sel=ord.filter(o=>o.p>=1.5).slice(0,want).map(o=>o.i);if(sel.length<Math.min(4,d.pool.length))sel=ord.slice(0,Math.min(Math.max(4,sel.length),want)).map(o=>o.i);}
    return {id:d.id,sel};
  }
  runFlow('🎯 Training',{next,onResult:(job,res)=>{used.add(job.id);lastCh=TK[job.id].ch;lastId=job.id;step++;
      const wrong=res.filter(r=>!r.ok);if(wrong.length&&!job.again){const d=TK[job.id];queue.push({id:job.id,due:step+3,sel:d.type==='sort'?wrong.map(r=>+r.k.split(':')[1]):null});}},
    total:N,training:true});
}
function runChapter(k){const ids=T.filter(d=>d.ch===k).map(d=>d.id);let i=0;runFlow(chOf(k).n,{next:()=>i<ids.length?{id:ids[i++]}:null,total:ids.length});}
function startExam(){
  const chs=DB.set.chs.length?DB.set.chs:CH.filter(c=>c.p).map(c=>c.k);const jobs=[];
  chs.forEach(k=>{const nf=T.filter(d=>d.ch===k&&d.type!=='free');if(nf.length)jobs.push({id:pick(nf,1)[0].id});});
  pick(chs,Math.min(3,chs.length)).forEach(k=>{const f=T.filter(d=>d.ch===k&&d.type==='free');if(f.length)jobs.push({id:pick(f,1)[0].id});});
  let i=0;runFlow('📝 Probearbeit',{next:()=>i<jobs.length?jobs[i++]:null,total:jobs.length,exam:true});
}
function startWeak(){const ids=[...new Set(Object.keys(DB.it).filter(shaky).map(k=>k.split(':')[0]))].filter(id=>TK[id]);
  const jobs=shuffle(ids).map(id=>{const d=TK[id];return {id,sel:d.type==='sort'?Object.keys(DB.it).filter(k=>k.startsWith(id+':')&&shaky(k)).map(k=>+k.split(':')[1]):null};});
  let i=0;runFlow('🔥 Fehler üben',{next:()=>i<jobs.length?jobs[i++]:null,total:jobs.length});}

function runFlow(title,o){
  const app=$('#app');let n=0,P=0,M=0;const log=[];const t0=Date.now();
  function show(){
    const job=o.next();if(!job){finish();return;}
    const t=inst(job.id,job.sel),c=chOf(t.ch);window.__cur=t;
    app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>${esc(title)}</h1></header>
    <div class="card"><div class="qhead"><span>Aufgabe ${n+1} von ${o.total}${job.again?' · 🔁 Wiederholung':''}</span><span>${c.ic} ${esc(c.n)}</span></div><div class="progress"><i style="width:${n/o.total*100}%"></i></div><div id="task"></div></div>`;
    $('#back').onclick=()=>{if(n===0||confirm('Übung abbrechen? Dein Lernstand bis hierher bleibt gespeichert.')){disarm();home();}};
    renderTask($('#task'),t,(res,pts,max)=>{res.forEach(r=>rec(r.k,r.ok));save();P+=pts;M+=max;log.push({t,pts,max,res});n++;o.onResult&&o.onResult(job,res);show();},o.exam);
    window.scrollTo(0,0);
  }
  function finish(){
    disarm();if(!M){home();toast('Hier gibt es gerade nichts zu üben 🎉');return;}
    const pct=Math.round(P/M*100),sec=Math.round((Date.now()-t0)/1000);
    DB.sessions.push({d:new Date().toISOString(),m:title,p:Math.round(P*10)/10,n:M});if(DB.sessions.length>200)DB.sessions.shift();save();
    const wrongK=[...new Set(log.flatMap(x=>x.res.filter(r=>!r.ok).map(r=>r.k)))].filter(k=>!sure(k));
    app.innerHTML=`<header><h1>${esc(title)} – Auswertung</h1></header>
    <div class="card"><div class="big-res">${Math.round(P*10)/10} / ${M} Punkte</div><p style="text-align:center;margin:0">${pct} % · ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} min</p>
    ${o.exam?`<p style="text-align:center;font-size:1.3rem;font-weight:800;margin:10px 0 0">Ungefähre Note: ${grade(pct)}</p><p class="muted" style="text-align:center;font-size:.8rem;margin:2px 0 0">Nur ein Richtwert – jede Lehrkraft bewertet etwas anders.</p>`:''}
    ${o.training?overallHtml():''}
    <div class="row"><button class="btn" id="again">${o.training?'Weiter trainieren':'Nochmal'}</button><button class="btn sec" id="menu">Menü</button></div></div>
    ${wrongK.length?`<div class="card rev"><h2 style="margin-top:0">Das kommt beim nächsten Training wieder dran</h2><ul style="margin:0;padding-left:20px">${wrongK.map(k=>`<li>${esc(itemLabel(k))}</li>`).join('')}</ul></div>`:''}`;
    $('#again').onclick=()=>o.training?startTraining():o.exam?startExam():runFlow(title,o.restart?o.restart():o);
    if(!o.training&&!o.exam&&title!=='🔥 Fehler üben'){const k=CH.find(c=>c.n===title);if(k)$('#again').onclick=()=>runChapter(k.k);}
    if(title==='🔥 Fehler üben')$('#again').onclick=startWeak;
    $('#menu').onclick=home;window.scrollTo(0,0);
  }
  show();
}
function grade(p){return p>=92?'1':p>=81?'2':p>=67?'3':p>=50?'4':p>=30?'5':'6';}
function overallHtml(){const chs=DB.set.chs;const all=CH.filter(c=>chs.includes(c.k)).flatMap(c=>chItems(c.k));const s=all.filter(sure).length,seen=all.filter(k=>DB.it[k]).length;
  return `<div class="stat" style="margin-top:12px"><span>Sicher gelernt</span><div class="bar"><i style="width:${s/all.length*100}%"></i></div><b>${s}/${all.length}</b></div><p class="muted" style="margin:0;font-size:.85rem">Schon gesehen: ${seen} von ${all.length} Lerninhalten.</p>`;}

/* =========================================================
   STARTSEITE
   ========================================================= */
function home(){
  disarm();const app=$('#app');const nWeak=Object.keys(DB.it).filter(shaky).length;
  const card=(c,i)=>{const it=chItems(c.k);const s=it.filter(sure).length;return `<div class="card chcard"><div class="chhead"><span class="chic">${c.ic}</span><div><b>${i}. ${esc(c.n)}</b><div class="muted" style="font-size:.85rem">${esc(c.d)}</div></div></div>
    <div class="stat"><div class="bar"><i style="width:${s/it.length*100}%"></i></div><b>${s}/${it.length}</b></div>
    <div class="row"><button class="btn sec small" data-l="${c.k}">📖 Lernzettel</button><button class="btn sec small" data-k="${c.k}">🃏 Begriffe</button><button class="btn small" data-u="${c.k}">✏️ Üben</button></div></div>`;};
  const A=CH.filter(c=>c.p),B=CH.filter(c=>!c.p);
  app.innerHTML=`<header><h1>🏺 Geschichte-Trainer</h1></header><p class="muted" style="margin:-6px 0 12px">Klasse 6 · Altsteinzeit, Jungsteinzeit, Bronzezeit, Kelten</p>
  <div class="card hero"><b style="font-size:1.15rem">🎯 Training – bis alles sitzt</b><p class="muted" style="margin:4px 0 8px;font-size:.9rem">10 gemischte Aufgaben. Neues und Fehler kommen öfter, Sicheres nur noch selten. Kein Kapitel zweimal hintereinander.</p>${overallHtml()}
  <button class="btn next" id="train">Training starten</button></div>
  <div class="grid"><button class="tile hi" id="exam"><span class="ic">📝</span><b>Probearbeit</b><span>Aus jedem Kapitel eine Aufgabe – mit Punkten und Note</span></button>
  <button class="tile" id="weak"><span class="ic">🔥</span><b>Fehler üben${nWeak?` (${nWeak})`:''}</b><span>Nur was noch nicht sitzt</span></button>
  <button class="tile" id="stats"><span class="ic">📊</span><b>Mein Lernstand</b><span>Was sitzt, was noch nicht?</span></button></div>
  <h2>Kapitel für die Probe</h2>${A.map((c,i)=>card(c,i+1)).join('')}
  <details class="card"><summary><b>Grundlagen aus der letzten Probe</b> <span class="muted">(Quellen, Epochen)</span></summary>${B.map((c,i)=>card(c,A.length+i+1)).join('')}</details>
  <div class="card settings"><label>Lücken ausfüllen</label><div class="seg" id="sAns"><button data-v="mc">Auswählen (leichter)</button><button data-v="text">Selbst schreiben (wie in der Probe)</button></div>
  <label style="margin-top:8px">Kapitel für Training und Probearbeit</label><div class="chsel">${CH.map(c=>`<label><input type="checkbox" value="${c.k}" ${DB.set.chs.includes(c.k)?'checked':''}> ${c.ic} ${esc(c.n)}</label>`).join('')}</div></div>
  <p class="muted" style="font-size:.8rem">Ein Lerninhalt „sitzt", wenn er zweimal hintereinander richtig war. Dein Lernstand bleibt nur auf diesem Gerät.</p>`;
  $('#sAns').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',DB.set.answer===b.dataset.v);b.onclick=()=>{DB.set.answer=b.dataset.v;save();home();};});
  app.querySelectorAll('.chsel input').forEach(x=>x.onchange=()=>{DB.set.chs=[...app.querySelectorAll('.chsel input:checked')].map(y=>y.value);if(!DB.set.chs.length){toast('Mindestens ein Kapitel 🙂');x.checked=true;DB.set.chs=[x.value];}save();});
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>showLearn(b.dataset.l));
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>showCards(b.dataset.k));
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>runChapter(b.dataset.u));
  $('#train').onclick=startTraining;$('#exam').onclick=startExam;$('#weak').onclick=startWeak;$('#stats').onclick=showStats;
  window.scrollTo(0,0);
}
function showLearn(k){disarm();const c=chOf(k);const app=$('#app');
  app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>${c.ic} ${esc(c.n)}</h1></header><div class="card learn">${LEARN[k]()}${k==='zeit'?'<div id="tl1" style="margin-top:12px"></div>':''}</div><button class="btn next" id="go">✏️ Jetzt dieses Kapitel üben</button>`;
  $('#back').onclick=home;$('#go').onclick=()=>runChapter(k);
  if(k==='zeit'){const t=timeline($('#tl1'),{bands:true});[[-763,'763 v.'],[-333,'333 v.'],[14,'14 n.'],[1492,'1492']].forEach(([y,l],i)=>t.mark(y,'#1b4fc0',l,i%2===0));}
  window.scrollTo(0,0);}
function showCards(k){disarm();const app=$('#app');const c=chOf(k);let deck=shuffle(CARDS[k]),i=0;
  function draw(){const d=deck[i];
    app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>🃏 ${esc(c.n)}</h1></header>
    <div class="card"><div class="qhead"><span>Karte ${i+1} von ${deck.length}</span><span>Antippen zum Umdrehen</span></div>
    <div class="flip" id="fl"><div class="in"><div class="f"><div class="big">${esc(d[0])}</div><div class="muted" style="margin-top:6px">Was bedeutet das?</div></div><div class="b"><div class="mid">${esc(d[1])}</div></div></div></div>
    <div class="row"><button class="btn sec" id="no">🤔 Nochmal</button><button class="btn" id="yes">✅ Wusste ich</button></div></div>`;
    $('#back').onclick=home;$('#fl').onclick=()=>$('#fl').classList.toggle('on');
    const go=ok=>{if(!ok)deck.push(d);i++;if(i>=deck.length){toast('Alle Begriffe geschafft! 🎉');deck=shuffle(CARDS[k]);i=0;}draw();};
    $('#yes').onclick=()=>go(true);$('#no').onclick=()=>go(false);}
  draw();}
function showStats(){disarm();const app=$('#app');const last=DB.sessions.slice(-8).reverse();
  app.innerHTML=`<header><button class="btn ghost" id="back">‹ Menü</button><h1>📊 Mein Lernstand</h1></header>
  <div class="card">${overallHtml()}</div>
  ${CH.map((c,i)=>{const it=chItems(c.k);const s=it.filter(sure).length;const weakL=it.filter(shaky);return `<div class="card"><h2 style="margin-top:0">${c.ic} ${esc(c.n)} <span class="muted">${s}/${it.length}</span></h2>
   <div class="stat"><div class="bar"><i style="width:${s/it.length*100}%"></i></div><b>${Math.round(s/it.length*100)} %</b></div>
   ${weakL.length?`<p style="margin:6px 0 2px"><b>🔥 Noch unsicher:</b></p><ul style="margin:0;padding-left:20px">${weakL.map(k=>`<li>${esc(itemLabel(k))}</li>`).join('')}</ul>`:it.some(k=>DB.it[k])?'':'<p class="muted" style="margin:4px 0">Noch nicht geübt.</p>'}</div>`;}).join('')}
  <div class="card"><h2 style="margin-top:0">Letzte Übungen</h2>${last.length?`<table><tr><th>Wann</th><th>Übung</th><th>Punkte</th></tr>${last.map(s=>`<tr><td>${new Date(s.d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} ${new Date(s.d).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(s.m)}</td><td>${s.p}/${s.n} (${Math.round(s.p/s.n*100)} %)</td></tr>`).join('')}</table>`:'<p class="muted">Noch keine Übung gemacht.</p>'}
  <button class="btn sec small" id="reset" style="margin-top:12px">Lernstand zurücksetzen</button></div>`;
  $('#back').onclick=home;$('#reset').onclick=()=>{if(confirm('Wirklich den ganzen Lernstand löschen?')){DB.it={};DB.sessions=[];DB.sess=0;save();showStats();}};
  window.scrollTo(0,0);}
home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
